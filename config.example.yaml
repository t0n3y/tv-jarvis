# Kopieren nach config.yaml und anpassen. Keine Geheimnisse hier rein (siehe .env.example).

location:
  # Ort für die Wetter-Abfrage (Open-Meteo Geocoding). Alternativ lat/lon direkt setzen
  # und city leer lassen, dann wird nicht geocodet.
  city: "Berlin"
  lat: null
  lon: null

schedule:
  # Zeiten im Format HH:MM, jeweils lokale Zeit des Pi.
  weekday:
    wake_time: "06:30"
    leave_time: "07:15"
  weekend:
    wake_time: "08:30"
    leave_time: "10:30"

tv_control:
  backend: "cec"          # "cec" oder "smart_plug"
  cec_device: "0"          # TV-Geräteadresse für cec-client (meist 0)
  # Welcher der beiden Pi-4-HDMI-CEC-Adapter mit dem Fernseher verbunden ist
  # (leer = cec-client waehlt automatisch, das kann aber den falschen Port
  # treffen). Ermitteln mit:
  #   for f in /sys/class/drm/*/status; do echo "$f: $(cat $f)"; done
  # und dann per `cec-client -l` den passenden com-port (/dev/cec0 oder
  # /dev/cec1) eintragen.
  cec_adapter: ""
  boot_wait_seconds: 3     # Wartezeit nach dem Einschalten, bevor Kiosk/TTS starten

calendars:
  google:
    enabled: true
    # "Geheime Adresse im iCal-Format" aus den Google-Kalender-Einstellungen
    ics_urls:
      - "https://calendar.google.com/calendar/ical/DEINE_ADRESSE/basic.ics"
  icloud:
    enabled: true
    # leer = alle Kalender, sonst Liste von Kalendernamen wie in der iCloud-Kalender-App
    calendar_names: []

iserv:
  enabled: true
  base_url: "https://DEINE-SCHULE.iserv.de"
  # Pfad zur Vertretungsplan-Ansicht - je nach Schule unterschiedlich, wird beim
  # Feinschliff (siehe README) an eure IServ-Instanz angepasst.
  vertretungsplan_path: "/iserv/plan/show"
  login_path: "/iserv/app/login"
  selectors:
    row: "table.plan tbody tr"
    lesson: "td.lesson"
    subject: "td.subject"
    room: "td.room"
    note: "td.note"

todos:
  provider: "icloud_shortcut"   # "icloud_shortcut" oder "notion"
  icloud_shortcut:
    cache_file: "data/todos_cache.json"
  notion:
    database_id: ""

audio:
  # ALSA-Geraet fuer den HDMI-Port, an dem der Fernseher haengt. Der Pi 4 hat
  # ZWEI HDMI-Audio-Karten (vc4hdmi0/vc4hdmi1) - "default" trifft nicht
  # zuverlaessig die richtige. Ermitteln mit `aplay -l` (Kartenname) und dazu
  # passend beim gleichen Port wie cec_adapter oben bleiben. Format:
  # "plughw:CARD=vc4hdmi1,DEV=0". Leer = ALSA-Standardgeraet versuchen.
  alsa_device: ""

radio:
  enabled: true
  # Sunshine-Live-Stream, beim Setup einmal verifizieren (siehe README)
  stream_url: "https://stream.sunshine-live.de/live/mp3-192/stream.sunshine-live.de"
  volume: 25

jellyfin:
  # Vom Pi aus gesehen - laeuft Jellyfin auf demselben Pi, localhost lassen.
  url: "http://127.0.0.1:8096"
  # Wessen Bibliothek/"Weiterschauen"-Stand die Fernbedienung nutzt. Dazu
  # JELLYFIN_API_KEY in .env setzen (siehe README, Abschnitt Jellyfin-App).
  username: ""

tts:
  voice: "de_DE-thorsten-medium"
  model_dir: "data/piper-voices"
  speed: 1.0

dashboard:
  # "::" = im ganzen WLAN per IPv4 UND IPv6 erreichbar (fuer die
  # Fernbedienung vom iPhone/iPad unter http://pi.local:8080/remote.html -
  # pi.local loest oft zuerst per IPv6 auf). "0.0.0.0" = nur IPv4,
  # "127.0.0.1" = nur auf dem Pi selbst.
  host: "::"
  port: 8080
  title: "JARVIS"
  boot_animation_seconds: 4
  shutdown_animation_seconds: 1.5
