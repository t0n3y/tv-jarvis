<div class="card stack">
  <label class="field"><input data-ref="text" type="text" maxlength="300" placeholder="Was soll der Fernseher sagen?" enterkeyhint="send" /></label>
  <button class="btn btn-primary btn-block" data-ref="say" type="button">Durchsagen</button>
</div>

<div class="group">
  <div class="group-row">
    <span class="row-label">Fernseher dafür einschalten</span>
    <label class="switch"><input type="checkbox" data-ref="power" /><span class="switch-slider"></span></label>
  </div>
</div>

<div class="section-label">Schnell-Durchsagen</div>
<div class="ds-presets" data-ref="presets"></div>

<div class="section-label" data-ref="history-label">Zuletzt</div>
<div class="group" data-ref="history"></div>
