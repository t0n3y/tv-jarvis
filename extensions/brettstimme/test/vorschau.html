<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brettstimme Testseite</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#302e2b;color:#fff;display:flex;gap:24px;padding:24px;align-items:flex-start}
  .board-layout-top,.board-layout-bottom{padding:8px 0}
  .move-time-content{font:700 22px monospace;background:#fff;color:#000;padding:4px 10px;border-radius:4px;display:inline-block}
  wc-chess-board{display:block;width:400px;height:400px;background:#769656}
  #log{white-space:pre;font:13px monospace}
</style>
<!-- Nur für die Testseite: Zuggenerator. Die Erweiterung selbst nutzt die Logik von chess.com. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
<div>
  <div class="board-layout-top"><div class="move-time-time"><div class="move-time-content move-time-monospace">5:00</div></div></div>
  <wc-chess-board></wc-chess-board>
  <div class="board-layout-bottom"><div class="move-time-time"><div class="move-time-content move-time-monospace">5:00</div></div></div>
  <p><button id="neu">Neue Partie (Weiß)</button> <button id="neuS">Neue Partie (Schwarz)</button></p>
</div>
<div id="log"></div>
<script>
// ---- Nachbildung der chess.com-Schnittstelle board.game ----
const brett = document.querySelector('wc-chess-board');
let chess, als, letzter, zeiten;
const farbe = (c) => (c === 'w' ? 1 : 2);
function zug(m, vorher, nachher) {
  return { from: m.from, to: m.to, piece: m.piece, san: m.san, color: farbe(m.color), flags: m.captured ? 1 : 0,
    captured: m.captured, promotion: m.promotion, beforeFen: vorher, fen: nachher };
}
function gegnerZieht() {
  setTimeout(() => {
    if (chess.game_over()) return;
    const ms = chess.moves({ verbose: true });
    // gern schlagen/Schach, damit Sonderfälle vorkommen
    const gut = ms.filter((m) => /[x+=#]|O-O/.test(m.san));
    const m = (gut.length && Math.random() < 0.6 ? gut : ms)[Math.floor(Math.random() * (gut.length && Math.random() < 0.6 ? gut.length : ms.length))] || ms[0];
    const vorher = chess.fen();
    chess.move(m);
    letzter = zug(m, vorher, chess.fen());
  }, 1500);
}
brett.game = {
  getFEN: () => chess.fen(),
  getTurn: () => farbe(chess.turn()),
  getPlayingAs: () => farbe(als),
  getHistorySANs: () => chess.history(),
  getLastMove: () => letzter,
  getLegalMoves: () => chess.moves({ verbose: true }).map((m) => zug(m)),
  isGameOver: () => chess.game_over(),
  getResult: () => (chess.in_checkmate() ? (chess.turn() === 'w' ? '0-1' : '1-0') : chess.game_over() ? '1/2-1/2' : '*'),
  move: ({ from, to, promotion }) => {
    const vorher = chess.fen();
    const m = chess.move({ from, to, promotion });
    if (!m) throw new Error('illegal');
    letzter = zug(m, vorher, chess.fen());
    gegnerZieht();
    return m;
  },
};
function neu(f, fen) {
  chess = new Chess(fen);
  als = f;
  letzter = null;
  if (als === 'b' && chess.turn() === 'w') gegnerZieht();
}
document.getElementById('neu').onclick = () => neu('w');
document.getElementById('neuS').onclick = () => neu('b');
neu('w');
// Uhr laufen lassen
let sek = [300, 300];
setInterval(() => {
  const i = chess.turn() === als ? 1 : 0;
  sek[i] = Math.max(0, sek[i] - 1);
  document.querySelectorAll('.move-time-content')[i].textContent = Math.floor(sek[i] / 60) + ':' + String(sek[i] % 60).padStart(2, '0');
}, 1000);
setInterval(() => { document.getElementById('log').textContent = chess.ascii() + '\n' + chess.history().join(' '); }, 500);
</script>
<script src="../src/parser.js"></script>
<script src="../src/stimme.js"></script>
<script src="../src/anzeige.js"></script>
<script src="../src/main.js"></script>
</body>
</html>
